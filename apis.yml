description: Plant an App is a developer-first low-code application development platform used to build
  case management systems, citizen service portals, workflow automation, compliance dashboards, and
  legacy-system integrations. It is positioned for government agencies, federal missions, and contractors,
  is hosted on Amazon Web Services, and offers a documentation portal, academy, and community for app
  builders. It is a low-code builder platform rather than a public REST API product; no public OpenAPI
  specification or API reference is published. Backed by 500 Global.
